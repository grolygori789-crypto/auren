<!doctype html>
<html lang="en" data-theme="pearl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#f2e7db" />
  <meta name="description" content="Auren — Personal Health Intelligence. Your body, understood." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icons/icon-192.png" />
  <link rel="stylesheet" href="./src/css/tokens.css" />
  <link rel="stylesheet" href="./src/css/app.css" />
  <title>Auren</title>
</head>
<body>
  <div id="opening" aria-label="Auren signature opening">
    <div class="opening-inner">
      <div class="opening-orb" id="openingOrbWrap"><canvas id="openingOrb" aria-label="Auren Core"></canvas></div>
      <div class="opening-id" id="openingIdentity">
        <div class="opening-name">AUREN</div>
        <div class="opening-tag" data-i18n="opening.tagline">Your body, understood.</div>
        <div class="opening-studio" data-i18n="opening.studio">By Benedict Interactive</div>
      </div>
    </div>
  </div>

  <div id="app">
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-mini"><div class="brand-mark" aria-hidden="true"></div><div class="brand-word">AUREN</div></div>
        <button class="icon-btn profile-trigger" id="profileBtn" aria-label="Open You">
          <img class="avatar-image topbar-avatar" id="topbarAvatar" alt="" hidden />
          <span class="avatar-fallback auren-profile-mark" id="topbarAvatarFallback" aria-hidden="true"><span class="fallback-initial" id="topbarInitial"></span><span class="fallback-orb"></span></span>
        </button>
      </header>

      <section class="screen active" data-screen="today">
        <div class="greeting">
          <div class="eyebrow" id="todayEyebrow"></div>
          <h1 id="greetingText"></h1>
          <p id="greetingSub"></p>
        </div>

        <div class="core-hero" id="coreHero">
          <div class="core-stage" id="coreStage">
            <svg class="auren-halo" id="aurenHalo" viewBox="0 0 100 100" aria-label="Auren Halo">
              <circle class="halo-arc halo-body" id="haloBodyArc" cx="50" cy="50" r="43.8"/>
              <circle class="halo-arc halo-daily" id="haloDailyArc" cx="50" cy="50" r="43.8"/>
              <circle class="halo-arc halo-movement" id="haloMovementArc" cx="50" cy="50" r="43.8"/>
              <circle class="halo-arc halo-trend" id="haloTrendArc" cx="50" cy="50" r="43.8"/>
              <circle class="halo-node halo-node-body" id="haloBodyNode" cx="50" cy="6.2" r="0.42"/>
              <circle class="halo-node halo-node-daily" id="haloDailyNode" cx="93.8" cy="50" r="0.42"/>
              <circle class="halo-node halo-node-movement" id="haloMovementNode" cx="50" cy="93.8" r="0.42"/>
              <circle class="halo-node halo-node-trend" id="haloTrendNode" cx="6.2" cy="50" r="0.42"/>
            </svg>
            <div class="core-orb waiting" id="todayOrbWrap"><canvas id="todayOrb" aria-label="Auren Core"></canvas></div>
          </div>
          <div class="state-caption">
            <div class="state-kicker" id="stateKicker"></div>
            <div class="state-title" id="stateTitle"></div>
            <div class="state-copy" id="stateCopy"></div>
            <div class="observed-grid" id="observedGrid" hidden></div>
            <button class="primary" id="checkinBtn"></button>
          </div>
        </div>

        <div class="section-head action-head"><h2 id="oneActionTitle"></h2><span id="oneActionBasis"></span></div>
        <div class="one-action-card card">
          <div class="one-action-mark" aria-hidden="true"><span></span></div>
          <div class="one-action-copy"><strong id="oneActionName"></strong><p id="oneActionCopy"></p></div>
        </div>

        <section class="halo-summary card" id="haloSummary">
          <div class="halo-summary-top">
            <div><div class="halo-eyebrow" id="haloEyebrow"></div><h2 id="haloTitle"></h2></div>
            <button class="text-link" id="haloDetailsBtn" type="button"></button>
          </div>
          <p id="haloCopy"></p>
          <div class="halo-legend" id="haloLegend"></div>
        </section>

        <div class="section-head"><h2 id="bodySectionTitle"></h2><span id="bodyPrivate"></span></div>
        <button class="body-context-card card" id="bodyContextBtn" type="button">
          <div class="body-context-top">
            <div class="soft-icon body-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M7.2 19c.5-3.8 2.1-5.8 4.8-5.8s4.3 2 4.8 5.8"/><path d="M5 12h3M16 12h3"/></svg></div>
            <div class="card-copy"><div class="card-title" id="bodyContextTitle"></div><div class="card-desc" id="bodyContextCopy"></div></div>
            <div class="chev">›</div>
          </div>
          <div class="body-metrics" id="bodyMetrics" hidden></div>
        </button>

        <div class="section-head"><h2 id="understandTitle"></h2><span id="privateLabel"></span></div>
        <div class="cards">
          <div class="card"><div class="card-row"><div class="soft-icon aqua"><svg viewBox="0 0 24 24"><path d="M5 14c2.2-4 4.5-6 7-6s4.8 2 7 6"/><path d="M7 17c1.6-2.2 3.2-3.3 5-3.3s3.4 1.1 5 3.3"/></svg></div><div class="card-copy"><div class="card-title" id="patternTitle"></div><div class="card-desc" id="patternDesc"></div></div><div class="chev">›</div></div></div>
          <div class="card"><div class="card-row"><div class="soft-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"/><path d="M12 7.5v4.8l3 1.7"/></svg></div><div class="card-copy"><div class="card-title" id="evidenceTitle"></div><div class="card-desc" id="evidenceDesc"></div></div><div class="chev">›</div></div></div>
        </div>
        <div class="trust-strip" id="trustStrip"></div>
      </section>

      <section class="screen" data-screen="rhythm">
        <div class="page-head"><div class="eyebrow">Auren 1 · Know Today</div><h1 class="page-title" id="rhythmTitle"></h1><p class="page-sub" id="rhythmSub"></p></div>
        <div class="empty-visual"><div><h3 id="rhythmEmptyTitle"></h3><p id="rhythmEmptyCopy"></p><div class="wave-demo"><svg viewBox="0 0 360 90" aria-hidden="true"><path d="M4 49 C40 49 46 27 78 31 S125 61 160 53 S205 31 237 37 S293 64 356 40" stroke="color-mix(in srgb,var(--gold-deep) 70%,transparent)"/><path d="M4 61 C44 68 69 48 102 54 S149 78 184 67 S232 43 264 49 S311 67 356 58" stroke="color-mix(in srgb,var(--aqua) 78%,transparent)"/></svg></div></div></div>
      </section>

      <section class="screen" data-screen="signals">
        <div class="page-head"><div class="eyebrow">Evidence · Confidence · Meaning</div><h1 class="page-title" id="signalsTitle"></h1><p class="page-sub" id="signalsSub"></p></div>
        <div class="empty-visual"><div><h3 id="signalsEmptyTitle"></h3><p id="signalsEmptyCopy"></p></div></div>
      </section>

      <section class="screen" data-screen="archive">
        <div class="page-head"><div class="eyebrow">Health Memory</div><h1 class="page-title" id="archiveTitle"></h1><p class="page-sub" id="archiveSub"></p></div>
        <div class="archive-switch" role="tablist" aria-label="Archive view">
          <button class="archive-mode active" id="archivePortraitsBtn" data-archive-mode="portraits" type="button"></button>
          <button class="archive-mode" id="archiveCalendarBtn" data-archive-mode="calendar" type="button"></button>
        </div>

        <div class="archive-view active" id="archivePortraitsView" data-archive-view="portraits">
          <div class="archive-empty card" id="archiveEmpty"><h3 id="archiveEmptyTitle"></h3><p id="archiveEmptyCopy"></p></div>
          <div class="portrait-grid" id="portraitGrid"></div>
        </div>

        <div class="archive-view" id="archiveCalendarView" data-archive-view="calendar">
          <div class="calendar-guide card" id="calendarGuide">
            <button class="calendar-guide-close" id="calendarGuideClose" type="button" aria-label="Dismiss">×</button>
            <strong id="calendarGuideTitle"></strong><p id="calendarGuideCopy"></p>
          </div>
          <section class="month-intelligence card" id="monthSummaryCard">
            <div class="month-summary-eyebrow" id="monthSummaryEyebrow"></div>
            <h2 id="monthSummaryTitle"></h2>
            <div class="month-summary-grid" id="monthSummaryGrid"></div>
            <p id="monthSummaryInsight"></p>
          </section>
          <section class="calendar-card card">
            <div class="calendar-head">
              <button class="calendar-nav" id="calendarPrev" type="button" aria-label="Previous month">‹</button>
              <div><strong id="calendarMonthTitle"></strong><span id="calendarMonthSub"></span></div>
              <button class="calendar-nav" id="calendarNext" type="button" aria-label="Next month">›</button>
            </div>
            <div class="calendar-weekdays" id="calendarWeekdays"></div>
            <div class="calendar-grid" id="calendarGrid"></div>
            <div class="calendar-legend" id="calendarLegend"></div>
          </section>
        </div>
      </section>

      <section class="screen" data-screen="you">
        <div class="page-head"><div class="eyebrow">Control · Privacy · Access</div><h1 class="page-title" id="youTitle"></h1><p class="page-sub" id="youSub"></p></div>
        <section class="identity-card card" aria-labelledby="identityTitle">
          <div class="identity-avatar-wrap">
            <img class="avatar-image identity-avatar" id="identityAvatar" alt="" hidden />
            <div class="identity-avatar-fallback auren-profile-mark" id="identityAvatarFallback" aria-hidden="true"><span class="fallback-initial" id="identityInitial"></span><span class="fallback-orb"></span></div>
            <span class="identity-avatar-ring" aria-hidden="true"></span>
          </div>
          <div class="identity-copy">
            <div class="identity-eyebrow" id="identityEyebrow"></div><h2 id="identityTitle"></h2><p id="identityCopy"></p>
            <form class="identity-name-form" id="identityNameForm">
              <label for="displayNameInput" id="displayNameLabel"></label>
              <div class="identity-name-row"><input id="displayNameInput" name="displayName" type="text" maxlength="40" autocomplete="name" /><button class="identity-name-save" id="saveDisplayNameBtn" type="submit"></button></div>
              <div class="identity-status" id="nameStatus" aria-live="polite"></div>
            </form>
            <div class="identity-actions"><button class="identity-action" id="uploadAvatarBtn" type="button"></button><button class="identity-remove" id="removeAvatarBtn" type="button" hidden></button></div>
            <input id="avatarInput" type="file" accept="image/*" hidden />
            <div class="identity-status" id="avatarStatus" aria-live="polite"></div>
          </div>
        </section>

        <div class="settings-list">
          <button class="setting setting-button" id="bodyProfileBtn" type="button"><div class="soft-icon aqua"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M7.2 19c.5-3.8 2.1-5.8 4.8-5.8s4.3 2 4.8 5.8"/><path d="M4 12h3M17 12h3"/></svg></div><div><strong id="bodyProfileTitle"></strong><span id="bodyProfileSub"></span></div><div class="end">›</div></button>
          <button class="setting setting-button" id="howAurenWorksBtn" type="button"><div class="soft-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M9.5 9.7a2.7 2.7 0 0 1 5.1 1.2c0 2-2.6 2.3-2.6 4"/><path d="M12 17.5h.01"/></svg></div><div><strong id="howWorksTitle"></strong><span id="howWorksSub"></span></div><div class="end">›</div></button>
          <div class="setting"><div class="soft-icon"><svg viewBox="0 0 24 24"><path d="M4 12h16"/><path d="M12 4v16"/></svg></div><div><strong id="languageTitle"></strong><span id="languageSub"></span></div><div class="lang-switch"><button id="enBtn" type="button">EN</button><button id="thBtn" type="button">TH</button></div></div>
          <div class="setting"><div class="soft-icon aqua"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 6v12M6 12h12"/></svg></div><div><strong id="appearanceTitle"></strong><span id="appearanceSub"></span></div></div>
          <div class="theme-grid" id="themeGrid"></div>
          <div class="setting"><div class="soft-icon aqua"><svg viewBox="0 0 24 24"><path d="M12 3.8l7 3v5.3c0 4.2-2.4 6.7-7 8.1-4.6-1.4-7-3.9-7-8.1V6.8l7-3z"/></svg></div><div><strong id="privacyTitle"></strong><span id="privacySub"></span></div><div class="end">›</div></div>
          <div class="setting"><div class="soft-icon"><svg viewBox="0 0 24 24"><path d="M5 12c1.7-3.7 4-5.5 7-5.5s5.3 1.8 7 5.5c-1.7 3.7-4 5.5-7 5.5S6.7 15.7 5 12z"/><circle cx="12" cy="12" r="2.2"/></svg></div><div><strong id="motionTitle"></strong><span id="motionSub"></span></div><div class="end" id="motionEnd"></div></div>
          <div class="setting"><div class="soft-icon"><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg></div><div><strong id="noAccountTitle"></strong><span id="noAccountSub"></span></div></div>
          <div class="setting"><div class="soft-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 8v4"/><path d="M12 15.5h.01"/></svg></div><div><strong id="aboutTitle"></strong><span id="aboutSub"></span></div><div class="end">›</div></div>
        </div>
        <div class="about-build" id="buildText"></div>
      </section>
    </div>

    <nav class="bottom-nav" aria-label="Primary">
      <div class="nav-bar">
        <button class="nav-btn active" data-nav="today" type="button"><svg viewBox="0 0 24 24"><path d="M4.5 10.5L12 4l7.5 6.5v8.5H5z"/><path d="M9.5 19v-5h5v5"/></svg><span id="navToday"></span></button>
        <button class="nav-btn" data-nav="rhythm" type="button"><svg viewBox="0 0 24 24"><path d="M4 14c2-5 4-5 6 0s4 5 6 0 3-4 4-2"/></svg><span id="navRhythm"></span></button>
        <button class="nav-btn" data-nav="signals" type="button"><svg viewBox="0 0 24 24"><path d="M5 17l4-5 3 2 7-8"/><circle cx="9" cy="12" r="1"/><circle cx="12" cy="14" r="1"/><circle cx="19" cy="6" r="1"/></svg><span id="navSignals"></span></button>
        <button class="nav-btn" data-nav="archive" type="button"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M8 9h8M8 13h8"/></svg><span id="navArchive"></span></button>
        <button class="nav-btn" data-nav="you" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5.5 19c.8-3.5 3-5.2 6.5-5.2s5.7 1.7 6.5 5.2"/></svg><span id="navYou"></span></button>
      </div>
    </nav>
  </div>

  <div class="modal-wrap" id="checkinModal" role="dialog" aria-modal="true" aria-labelledby="checkinTitle">
    <form class="sheet" id="checkinForm"><div class="sheet-handle"></div><h3 id="checkinTitle"></h3><p class="sheet-intro" id="checkinIntro"></p><div class="checkin-fields" id="checkinFields"></div><div class="sheet-actions"><button class="save-btn" id="saveCheckinBtn" type="submit"></button><button class="ghost-btn" id="closeCheckinBtn" type="button"></button></div><div class="status" id="checkinStatus" aria-live="polite"></div></form>
  </div>

  <div class="modal-wrap" id="profileModal" role="dialog" aria-modal="true" aria-labelledby="profileTitle">
    <form class="sheet profile-sheet" id="profileForm">
      <div class="sheet-handle"></div><h3 id="profileTitle"></h3><p class="sheet-intro" id="profileIntro"></p>
      <div class="profile-fields">
        <label class="profile-field"><span class="field-label-row"><span id="profileAgeLabel"></span><button class="field-info" type="button" data-help="age">ⓘ</button></span><input id="profileAge" name="age" type="number" inputmode="numeric" min="2" max="120" required /><small id="profileAgeHint"></small></label>
        <label class="profile-field"><span class="field-label-row"><span id="profileSexLabel"></span><button class="field-info" type="button" data-help="sex">ⓘ</button></span><select id="profileSex" name="sexForCalc"></select><small id="profileSexHint"></small></label>
        <div class="profile-field-row">
          <label class="profile-field"><span id="profileHeightLabel"></span><div class="input-unit"><input id="profileHeight" name="heightCm" type="number" inputmode="decimal" min="50" max="230" step="0.1" required /><b>cm</b></div></label>
          <label class="profile-field"><span id="profileWeightLabel"></span><div class="input-unit"><input id="profileWeight" name="weightKg" type="number" inputmode="decimal" min="5" max="350" step="0.1" required /><b>kg</b></div></label>
        </div>
        <label class="profile-field"><span class="field-label-row"><span id="profileActivityLabel"></span><button class="field-info" type="button" data-help="activity">ⓘ</button></span><select id="profileActivity" name="activity"></select></label>
        <label class="profile-field"><span class="field-label-row"><span id="profileTrainingLabel"></span><button class="field-info" type="button" data-help="training">ⓘ</button></span><select id="profileTraining" name="trainingType"></select><small id="profileTrainingHint"></small></label>
        <label class="profile-field"><span id="profileFrequencyLabel"></span><div class="input-unit"><input id="profileFrequency" name="trainingFrequency" type="number" inputmode="numeric" min="0" max="14" step="1" /><b id="frequencyUnit"></b></div></label>
        <label class="profile-field"><span class="field-label-row"><span id="profileGoalLabel"></span><button class="field-info" type="button" data-help="goal">ⓘ</button></span><select id="profileGoal" name="goal"></select></label>
        <div class="optional-divider"><span id="optionalEvidenceTitle"></span></div>
        <div class="profile-field-row">
          <label class="profile-field"><span class="field-label-row"><span id="profileWaistLabel"></span><button class="field-info" type="button" data-help="waist">ⓘ</button></span><div class="input-unit"><input id="profileWaist" name="waistCm" type="number" inputmode="decimal" min="30" max="250" step="0.1" /><b>cm</b></div><small id="profileWaistHint"></small></label>
          <label class="profile-field"><span class="field-label-row"><span id="profileBodyFatLabel"></span><button class="field-info" type="button" data-help="bodyFat">ⓘ</button></span><div class="input-unit"><input id="profileBodyFat" name="bodyFatPct" type="number" inputmode="decimal" min="2" max="75" step="0.1" /><b>%</b></div><small id="profileBodyFatHint"></small></label>
        </div>
        <div class="reference-note" id="profileReferenceNote"></div>
      </div>
      <div class="sheet-actions"><button class="save-btn" id="saveProfileBtn" type="submit"></button><button class="ghost-btn" id="closeProfileBtn" type="button"></button></div><div class="status" id="profileStatus" aria-live="polite"></div>
    </form>
  </div>

  <div class="modal-wrap" id="avatarEditorModal" role="dialog" aria-modal="true" aria-labelledby="avatarEditorTitle">
    <div class="sheet avatar-editor-sheet"><div class="sheet-handle"></div><div class="avatar-editor-head"><div><div class="avatar-editor-eyebrow" id="avatarEditorEyebrow"></div><h3 id="avatarEditorTitle"></h3></div><button class="avatar-editor-close" id="cancelAvatarCropTopBtn" type="button" aria-label="Close">×</button></div><p class="sheet-intro" id="avatarEditorIntro"></p><div class="avatar-crop-shell"><div class="avatar-crop-viewport" id="avatarCropViewport"><img id="avatarCropImage" alt="" draggable="false" /><span class="avatar-crop-ring" aria-hidden="true"></span></div></div><label class="avatar-zoom-control" for="avatarZoom"><span id="avatarZoomLabel"></span><input id="avatarZoom" type="range" min="1" max="3" step="0.01" value="1" /></label><div class="avatar-crop-hint" id="avatarCropHint"></div><div class="avatar-editor-actions"><button class="save-btn" id="saveAvatarCropBtn" type="button"></button><button class="ghost-btn" id="resetAvatarCropBtn" type="button"></button><button class="ghost-btn" id="cancelAvatarCropBtn" type="button"></button></div><div class="status" id="avatarCropStatus" aria-live="polite"></div></div>
  </div>

  <div class="modal-wrap" id="haloModal" role="dialog" aria-modal="true" aria-labelledby="haloModalTitle">
    <div class="sheet halo-sheet"><div class="sheet-handle"></div><h3 id="haloModalTitle"></h3><p class="sheet-intro" id="haloModalIntro"></p><div class="evidence-list" id="haloEvidenceList"></div><div class="sheet-actions"><button class="ghost-btn" id="closeHaloBtn" type="button"></button></div></div>
  </div>

  <div class="modal-wrap" id="helpModal" role="dialog" aria-modal="true" aria-labelledby="helpModalTitle">
    <div class="sheet help-sheet"><div class="sheet-handle"></div><div class="help-eyebrow" id="helpModalEyebrow"></div><h3 id="helpModalTitle"></h3><div class="help-content" id="helpModalContent"></div><div class="sheet-actions"><button class="ghost-btn" id="closeHelpBtn" type="button"></button></div></div>
  </div>

  <div class="modal-wrap" id="howWorksModal" role="dialog" aria-modal="true" aria-labelledby="howWorksModalTitle">
    <div class="sheet how-works-sheet"><div class="sheet-handle"></div><div class="help-eyebrow" id="howWorksEyebrow"></div><h3 id="howWorksModalTitle"></h3><p class="sheet-intro" id="howWorksIntro"></p><div class="how-works-list" id="howWorksList"></div><div class="sheet-actions"><button class="ghost-btn" id="closeHowWorksBtn" type="button"></button></div></div>
  </div>

  <div class="modal-wrap" id="dayDetailModal" role="dialog" aria-modal="true" aria-labelledby="dayDetailTitle">
    <div class="sheet day-detail-sheet"><div class="sheet-handle"></div><div class="day-detail-eyebrow" id="dayDetailEyebrow"></div><h3 id="dayDetailTitle"></h3><p class="sheet-intro" id="dayDetailIntro"></p><div class="day-detail-state" id="dayDetailState"></div><div class="day-detail-metrics" id="dayDetailMetrics"></div><div class="day-detail-weight" id="dayDetailWeight" hidden></div><div class="day-detail-evidence" id="dayDetailEvidence"></div><div class="sheet-actions"><button class="ghost-btn" id="closeDayDetailBtn" type="button"></button></div></div>
  </div>

  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
