<!doctype html>
<html lang="en" data-theme="pearl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f2e7db" />
  <meta name="description" content="Auren — Personal Health Intelligence. Your body, understood." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icons/icon-192.png" />
  <link rel="stylesheet" href="./src/css/tokens.css" />
  <link rel="stylesheet" href="./src/css/app.css" />
  <title>Auren</title>
</head>
<body>
  <div id="opening" aria-label="Auren signature opening">
    <div class="opening-inner">
      <div class="opening-orb" id="openingOrbWrap"><canvas id="openingOrb" aria-label="Auren Core"></canvas></div>
      <div class="opening-id" id="openingIdentity">
        <div class="opening-name">AUREN</div>
        <div class="opening-tag" data-i18n="opening.tagline">Your body, understood.</div>
        <div class="opening-studio" data-i18n="opening.studio">By Benedict Interactive</div>
      </div>
    </div>
  </div>

  <div id="app">
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-mini"><div class="brand-mark" aria-hidden="true"></div><div class="brand-word">AUREN</div></div>
        <button class="icon-btn profile-trigger" id="profileBtn" aria-label="Open You">
          <img class="avatar-image topbar-avatar" id="topbarAvatar" alt="" hidden />
          <svg class="avatar-fallback" id="topbarAvatarFallback" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 19c.8-3.6 3-5.4 6.5-5.4s5.7 1.8 6.5 5.4"/></svg>
        </button>
      </header>

      <section class="screen active" data-screen="today">
        <div class="greeting">
          <div class="eyebrow" id="todayEyebrow"></div>
          <h1 id="greetingText"></h1>
          <p id="greetingSub"></p>
        </div>

        <div class="core-hero">
          <div class="core-stage" id="coreStage">
            <svg class="auren-halo" id="aurenHalo" viewBox="0 0 100 100" aria-label="Auren Halo">
              <circle class="halo-orbit-outer" cx="50" cy="50" r="47"/>
              <circle class="halo-orbit-inner" cx="50" cy="50" r="44.8"/>
              <circle class="halo-arc halo-body" id="haloBodyArc" cx="50" cy="50" r="47"/>
              <circle class="halo-arc halo-daily" id="haloDailyArc" cx="50" cy="50" r="47"/>
              <circle class="halo-arc halo-movement" id="haloMovementArc" cx="50" cy="50" r="47"/>
              <circle class="halo-arc halo-continuity" id="haloContinuityArc" cx="50" cy="50" r="47"/>
              <circle class="halo-node halo-node-body" id="haloBodyNode" cx="50" cy="3" r="0.82"/>
              <circle class="halo-node halo-node-daily" id="haloDailyNode" cx="97" cy="50" r="0.82"/>
              <circle class="halo-node halo-node-movement" id="haloMovementNode" cx="50" cy="97" r="0.82"/>
              <circle class="halo-node halo-node-continuity" id="haloContinuityNode" cx="3" cy="50" r="0.82"/>
            </svg>
            <div class="core-orb waiting" id="todayOrbWrap"><canvas id="todayOrb" aria-label="Auren Core"></canvas></div>
          </div>
          <div class="state-caption">
            <div class="state-kicker" id="stateKicker"></div>
            <div class="state-title" id="stateTitle"></div>
            <div class="state-copy" id="stateCopy"></div>
            <div class="observed-grid" id="observedGrid" hidden></div>
            <button class="primary" id="checkinBtn"></button>
          </div>
        </div>

        <section class="halo-summary card" id="haloSummary">
          <div class="halo-summary-top">
            <div>
              <div class="halo-eyebrow" id="haloEyebrow"></div>
              <h2 id="haloTitle"></h2>
            </div>
            <button class="text-link" id="haloDetailsBtn" type="button"></button>
          </div>
          <p id="haloCopy"></p>
          <div class="halo-legend" id="haloLegend"></div>
        </section>

        <div class="section-head action-head"><h2 id="oneActionTitle"></h2><span id="oneActionBasis"></span></div>
        <div class="one-action-card card">
          <div class="one-action-mark" aria-hidden="true"><span></span></div>
          <div class="one-action-copy"><strong id="oneActionName"></strong><p id="oneActionCopy"></p></div>
        </div>

        <div class="section-head"><h2 id="bodySectionTitle"></h2><span id="bodyPrivate"></span></div>
        <button class="body-context-card card" id="bodyContextBtn" type="button">
          <div class="body-context-top">
            <div class="soft-icon body-icon">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M7.2 19c.5-3.8 2.1-5.8 4.8-5.8s4.3 2 4.8 5.8"/><path d="M5 12h3M16 12h3"/></svg>
            </div>
            <div class="card-copy"><div class="card-title" id="bodyContextTitle"></div><div class="card-desc" id="bodyContextCopy"></div></div>
            <div class="chev">›</div>
          </div>
          <div class="body-metrics" id="bodyMetrics" hidden></div>
        </button>

        <div class="section-head"><h2 id="understandTitle"></h2><span id="privateLabel"></span></div>
        <div class="cards">
          <div class="card"><div class="card-row"><div class="soft-icon aqua"><svg viewBox="0 0 24 24"><path d="M5 14c2.2-4 4.5-6 7-6s4.8 2 7 6"/><path d="M7 17c1.6-2.2 3.2-3.3 5-3.3s3.4 1.1 5 3.3"/></svg></div><div class="card-copy"><div class="card-title" id="patternTitle"></div><div class="card-desc" id="patternDesc"></div></div><div class="chev">›</div></div></div>
          <div class="card"><div class="card-row"><div class="soft-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"/><path d="M12 7.5v4.8l3 1.7"/></svg></div><div class="card-copy"><div class="card-title" id="evidenceTitle"></div><div class="card-desc" id="evidenceDesc"></div></div><div class="chev">›</div></div></div>
        </div>
        <div class="trust-strip" id="trustStrip"></div>
      </section>

      <section class="screen" data-screen="rhythm">
        <div class="page-head"><div class="eyebrow">Auren 1 · Know Today</div><h1 class="page-title" id="rhythmTitle"></h1><p class="page-sub" id="rhythmSub"></p></div>
        <div class="empty-visual"><div><h3 id="rhythmEmptyTitle"></h3><p id="rhythmEmptyCopy"></p><div class="wave-demo"><svg viewBox="0 0 360 90" aria-hidden="true"><path d="M4 49 C40 49 46 27 78 31 S125 61 160 53 S205 31 237 37 S293 64 356 40" stroke="color-mix(in srgb,var(--gold-deep) 70%,transparent)"/><path d="M4 61 C44 68 69 48 102 54 S149 78 184 67 S232 43 264 49 S311 67 356 58" stroke="color-mix(in srgb,var(--aqua) 78%,transparent)"/></svg></div></div></div>
      </section>

      <section class="screen" data-screen="signals">
        <div class="page-head"><div class="eyebrow">Evidence · Confidence · Meaning</div><h1 class="page-title" id="signalsTitle"></h1><p class="page-sub" id="signalsSub"></p></div>
        <div class="empty-visual"><div><h3 id="signalsEmptyTitle"></h3><p id="signalsEmptyCopy"></p></div></div>
      </section>

      <section class="screen" data-screen="archive">
        <div class="page-head"><div class="eyebrow">State Portraits</div><h1 class="page-title" id="archiveTitle"></h1><p class="page-sub" id="archiveSub"></p></div>
        <div class="empty-visual"><div><h3 id="archiveEmptyTitle"></h3><p id="archiveEmptyCopy"></p></div></div>
      </section>

      <section class="screen" data-screen="you">
        <div class="page-head"><div class="eyebrow">Control · Privacy · Access</div><h1 class="page-title" id="youTitle"></h1><p class="page-sub" id="youSub"></p></div>
        <section class="identity-card card" aria-labelledby="identityTitle">
          <div class="identity-avatar-wrap">
            <img class="avatar-image identity-avatar" id="identityAvatar" alt="" hidden />
            <div class="identity-avatar-fallback" id="identityAvatarFallback" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 19c.8-3.6 3-5.4 6.5-5.4s5.7 1.8 6.5 5.4"/></svg>
            </div>
            <span class="identity-avatar-ring" aria-hidden="true"></span>
          </div>
          <div class="identity-copy">
            <div class="identity-eyebrow" id="identityEyebrow"></div>
            <h2 id="identityTitle"></h2>
            <p id="identityCopy"></p>
            <div class="identity-actions">
              <button class="identity-action" id="uploadAvatarBtn" type="button"></button>
              <button class="identity-remove" id="removeAvatarBtn" type="button" hidden></button>
            </div>
            <input id="avatarInput" type="file" accept="image/*" hidden />
            <div class="identity-status" id="avatarStatus" aria-live="polite"></div>
          </div>
        </section>
        <div class="settings-list">
          <button class="setting setting-button" id="bodyProfileBtn" type="button"><div class="soft-icon aqua"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M7.2 19c.5-3.8 2.1-5.8 4.8-5.8s4.3 2 4.8 5.8"/><path d="M4 12h3M17 12h3"/></svg></div><div><strong id="bodyProfileTitle"></strong><span id="bodyProfileSub"></span></div><div class="end">›</div></button>
          <div class="setting"><div class="soft-icon"><svg viewBox="0 0 24 24"><path d="M4 12h16"/><path d="M12 4v16"/></svg></div><div><strong id="languageTitle"></strong><span id="languageSub"></span></div><div class="lang-switch"><button id="enBtn" type="button">EN</button><button id="thBtn" type="button">TH</button></div></div>
          <div class="setting"><div class="soft-icon aqua"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 6v12M6 12h12"/></svg></div><div><strong id="appearanceTitle"></strong><span id="appearanceSub"></span></div></div>
          <div class="theme-grid" id="themeGrid"></div>
          <div class="setting"><div class="soft-icon aqua"><svg viewBox="0 0 24 24"><path d="M12 3.8l7 3v5.3c0 4.2-2.4 6.7-7 8.1-4.6-1.4-7-3.9-7-8.1V6.8l7-3z"/></svg></div><div><strong id="privacyTitle"></strong><span id="privacySub"></span></div><div class="end">›</div></div>
          <div class="setting"><div class="soft-icon"><svg viewBox="0 0 24 24"><path d="M5 12c1.7-3.7 4-5.5 7-5.5s5.3 1.8 7 5.5c-1.7 3.7-4 5.5-7 5.5S6.7 15.7 5 12z"/><circle cx="12" cy="12" r="2.2"/></svg></div><div><strong id="motionTitle"></strong><span id="motionSub"></span></div><div class="end" id="motionEnd"></div></div>
          <div class="setting"><div class="soft-icon"><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg></div><div><strong id="noAccountTitle"></strong><span id="noAccountSub"></span></div></div>
          <div class="setting"><div class="soft-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 8v4"/><path d="M12 15.5h.01"/></svg></div><div><strong id="aboutTitle"></strong><span id="aboutSub"></span></div><div class="end">›</div></div>
        </div>
        <div class="about-build" id="buildText"></div>
      </section>
    </div>

    <nav class="bottom-nav" aria-label="Primary">
      <div class="nav-bar">
        <button class="nav-btn active" data-nav="today" type="button"><svg viewBox="0 0 24 24"><path d="M4.5 10.5L12 4l7.5 6.5v8.5H5z"/><path d="M9.5 19v-5h5v5"/></svg><span id="navToday"></span></button>
        <button class="nav-btn" data-nav="rhythm" type="button"><svg viewBox="0 0 24 24"><path d="M4 14c2-5 4-5 6 0s4 5 6 0 3-4 4-2"/></svg><span id="navRhythm"></span></button>
        <button class="nav-btn" data-nav="signals" type="button"><svg viewBox="0 0 24 24"><path d="M5 17l4-5 3 2 7-8"/><circle cx="9" cy="12" r="1"/><circle cx="12" cy="14" r="1"/><circle cx="19" cy="6" r="1"/></svg><span id="navSignals"></span></button>
        <button class="nav-btn" data-nav="archive" type="button"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M8 9h8M8 13h8"/></svg><span id="navArchive"></span></button>
        <button class="nav-btn" data-nav="you" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5.5 19c.8-3.5 3-5.2 6.5-5.2s5.7 1.7 6.5 5.2"/></svg><span id="navYou"></span></button>
      </div>
    </nav>
  </div>

  <div class="modal-wrap" id="checkinModal" role="dialog" aria-modal="true" aria-labelledby="checkinTitle">
    <form class="sheet" id="checkinForm">
      <div class="sheet-handle"></div>
      <h3 id="checkinTitle"></h3>
      <p class="sheet-intro" id="checkinIntro"></p>
      <div class="checkin-fields" id="checkinFields"></div>
      <div class="sheet-actions"><button class="save-btn" id="saveCheckinBtn" type="submit"></button><button class="ghost-btn" id="closeCheckinBtn" type="button"></button></div>
      <div class="status" id="checkinStatus" aria-live="polite"></div>
    </form>
  </div>

  <div class="modal-wrap" id="profileModal" role="dialog" aria-modal="true" aria-labelledby="profileTitle">
    <form class="sheet profile-sheet" id="profileForm">
      <div class="sheet-handle"></div>
      <h3 id="profileTitle"></h3>
      <p class="sheet-intro" id="profileIntro"></p>
      <div class="profile-fields">
        <label class="profile-field"><span id="profileAgeLabel"></span><input id="profileAge" name="age" type="number" inputmode="numeric" min="2" max="120" required /><small id="profileAgeHint"></small></label>
        <div class="profile-field-row">
          <label class="profile-field"><span id="profileHeightLabel"></span><div class="input-unit"><input id="profileHeight" name="heightCm" type="number" inputmode="decimal" min="50" max="230" step="0.1" required /><b>cm</b></div></label>
          <label class="profile-field"><span id="profileWeightLabel"></span><div class="input-unit"><input id="profileWeight" name="weightKg" type="number" inputmode="decimal" min="5" max="350" step="0.1" required /><b>kg</b></div></label>
        </div>
        <label class="profile-field"><span id="profileActivityLabel"></span><select id="profileActivity" name="activity"></select></label>
        <label class="profile-field"><span id="profileGoalLabel"></span><select id="profileGoal" name="goal"></select></label>
        <div class="reference-note" id="profileReferenceNote"></div>
      </div>
      <div class="sheet-actions"><button class="save-btn" id="saveProfileBtn" type="submit"></button><button class="ghost-btn" id="closeProfileBtn" type="button"></button></div>
      <div class="status" id="profileStatus" aria-live="polite"></div>
    </form>
  </div>

  <div class="modal-wrap" id="haloModal" role="dialog" aria-modal="true" aria-labelledby="haloModalTitle">
    <div class="sheet halo-sheet">
      <div class="sheet-handle"></div>
      <h3 id="haloModalTitle"></h3>
      <p class="sheet-intro" id="haloModalIntro"></p>
      <div class="evidence-list" id="haloEvidenceList"></div>
      <div class="sheet-actions"><button class="ghost-btn" id="closeHaloBtn" type="button"></button></div>
    </div>
  </div>

  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
